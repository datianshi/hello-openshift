apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  generateName: openshift-hello-build-
spec:
  params:
  - name: IMAGE_URL
    value: shaozhendemoregistry.azurecr.io/mobb/hello-openshift
  - name: GIT_REVISION
    value: 5b4744361d5cb1f245f0c0ae08e6bece1f1a5529
  pipelineRef:
    name: openshift-helloworld-build
  workspaces:
    - name: source-workspace
      persistentVolumeClaim:
        claimName: openshift-hello-build-workspace
      subPath: source
    - name: gitops-workspace
      persistentVolumeClaim:
        claimName: openshift-hello-build-workspace
      subPath: gitops
    - name: gitops-gitsecret
      secret:
        secretName: git-ssh-credentials-hello-openshift-config